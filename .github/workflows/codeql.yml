name: CodeQL

# CodeQL — ה-SAST של GitHub עם taint tracking עמוק.
# חינם לרפוזיטוריז ציבוריים. הממצאים מופיעים בלשונית Security > Code scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # סריקה שבועית, יום שני 06:00 UTC

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write   # נדרש כדי להעלות ממצאים ל-Code scanning

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended   # חבילת החוקים המורחבת — כולל taint tracking

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
