name: hello world!                    # Workflow: what it's called
on:                                   # Workflow: what triggers it (the GitHub Event)
  workflow_dispatch:
jobs:                                 # Workflow contains jobs
  say-hello-inline-bash:              #   Job: you name it
    runs-on: ubuntu-latest            #   Job: where it runs (the machine)
    steps:                            #   Job contains steps
     - run: echo "hello world!"       #     Step: what to do
  say-hello-python:
    runs-on: ubuntu-latest
    steps:
     - run: print("hello world from python!")
       shell: python
